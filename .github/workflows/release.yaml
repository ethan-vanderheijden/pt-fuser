name: Release Rust Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      # Every target builds the same commit, so all platforms embed the same
      # version and no runner has to shell out to Git for it.
      PT_FUSER_COMMIT: ${{ github.sha }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (Native build)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            use_cross: false
          # Linux ARM64 (Cross-compiled via Docker)
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            use_cross: true
          # macOS x86_64 (Native build)
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          # macOS ARM64 (Cross-compiled natively)
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustc, cargo, rust-std
      - name: Install Cross-Compile Tool
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build Release Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            CMD="cross"
          else
            CMD="cargo"
          fi

          $CMD build --release --locked --all-features --target ${{ matrix.target }}
      - name: Package Binary
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../pt-fuser-${{ matrix.target }}.tar.gz merge histogram convert_perfetto process_trace
          cd ../../..
      - name: Upload Asset to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: pt-fuser-${{ matrix.target }}.tar.gz
