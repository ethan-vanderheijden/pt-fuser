[package]
name = "pt-fuser"
version.workspace = true
edition.workspace = true
rust-version = "1.93.0"

[dependencies]
bloomfilter = "3.0.1"
clap = { version = "4.6.0", features = ["derive"] }
ctrlc = "3.5.2"
eframe = { version = "0.34.1", optional = true }
egui = { version = "0.34.1", optional = true }
egui_plot = { version = "0.35.0", optional = true }
flate2 = "1.1.9"
flexbuffers = "25.12.19"
indexmap = { version = "2.14.0", features = ["serde"] }
indicatif = "0.18.6"
perfetto-rust = { path = "../perfetto-rust" }
prost = "0.14.3"
prost-types = "0.14.3"
rayon = "1.11.0"
rc = "0.1.1"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive", "rc"] }
thin-vec = { version = "0.2.19", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[features]
gui = ["dep:eframe", "dep:egui", "dep:egui_plot"]
